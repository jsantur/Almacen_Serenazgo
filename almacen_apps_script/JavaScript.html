  /* ═══════════════════════════════════════════════════════════

  const paginationState = {
    inventory:  { page: 1, pageSize: 10 },

  /**
   * Renders pagination controls into a container.
   * @param {string} containerId  - ID of the .pagination-bar div
   * @param {number} total        - total filtered items
   * @param {number} page         - current page (1-based)
   * @param {number} pageSize     - items per page
   * @param {Function} onPage     - callback(newPage) when user clicks a page
   */
  function renderPagination(containerId, total, page, pageSize, onPage) {
    const container = document.getElementById(containerId);
    if (!container) return;

    const totalPages = Math.max(1, Math.ceil(total / pageSize));
    const from = total === 0 ? 0 : (page - 1) * pageSize + 1;
    const to   = Math.min(page * pageSize, total);

    // Build page number array with ellipsis
    function pageNumbers(cur, last) {
      if (last <= 7) return Array.from({ length: last }, (_, i) => i + 1);
      const pages = [];
      pages.push(1);
      if (cur > 3) pages.push('...');
      for (let i = Math.max(2, cur - 1); i <= Math.min(last - 1, cur + 1); i++) pages.push(i);
      if (cur < last - 2) pages.push('...');
      pages.push(last);
      return pages;
    }

    const nums = pageNumbers(page, totalPages);

    let html = `<span class="pagination-info">${from}–${to} de ${total}</span>`;
    html += `<div class="pagination-controls">`;
    html += `<button class="pg-btn" onclick="${onPage.name}(${page - 1})" ${page <= 1 ? 'disabled' : ''} title="Anterior">‹</button>`;
    nums.forEach(n => {
      if (n === '...') {
        html += `<span class="pg-btn ellipsis">…</span>`;
      } else {
        html += `<button class="pg-btn${n === page ? ' active' : ''}" onclick="${onPage.name}(${n})" ${n === page ? 'aria-current="page"' : ''}>${n}</button>`;
      }
    });
    html += `<button class="pg-btn" onclick="${onPage.name}(${page + 1})" ${page >= totalPages ? 'disabled' : ''} title="Siguiente">›</button>`;
    html += `</div>`;

    container.innerHTML = html;
  }

  function renderInventory() {
    const q = (document.getElementById('inventorySearch')?.value || '').toLowerCase();
    const status = document.getElementById('inventoryStatus')?.value || '';

    // 1. FILTER
    const filtered = state.inventory.filter(i => {
      const hay = [i.codigo, i.tipo, i.modelo, i.color, i.talla, i.descripcion].join(' ').toLowerCase();
      return (!q || hay.includes(q)) && (!status || i.estado === status);
    });

    // 2. PAGINATE
    const ps = paginationState.inventory;
    const start = (ps.page - 1) * ps.pageSize;
    const pageRows = filtered.slice(start, start + ps.pageSize);

    // 3. RENDER ROWS
    document.getElementById('inventoryTable').innerHTML = pageRows.length
      ? pageRows.map(rowInventoryFull).join('')
      : '<tr><td colspan="10" class="empty">No se encontraron registros.</td></tr>';

    // 4. RENDER PAGINATION
    renderPagination('inventoryPagination', filtered.length, ps.page, ps.pageSize, goInventoryPage);
  }

  function goInventoryPage(page) {
    const ps = paginationState.inventory;
    const totalPages = Math.max(1, Math.ceil(
      state.inventory.filter(i => {
        const q = (document.getElementById('inventorySearch')?.value || '').toLowerCase();
        const status = document.getElementById('inventoryStatus')?.value || '';
        const hay = [i.codigo, i.tipo, i.modelo, i.color, i.talla, i.descripcion].join(' ').toLowerCase();
        return (!q || hay.includes(q)) && (!status || i.estado === status);
      }).length / ps.pageSize
    ));
    ps.page = Math.max(1, Math.min(page, totalPages));
    renderInventory();
  }

  function renderMovements() {
    const body = document.getElementById('movementsTable');

    // 1. GROUP by movementGroupId (or synthetic key) — preserves multiproduct integrity
    const groups = {};
    const groupOrder = [];
    state.movements.forEach(m => {
      const gid = m.movementGroupId || (m.fecha + '|' + m.codigo + '|' + m.tipoMovimiento);
      if (!groups[gid]) { groups[gid] = []; groupOrder.push(gid); }
      groups[gid].push(m);
    });

    // 2. PAGINATE GROUPS (never split a group across pages)
    const ps = paginationState.movements;
    const start = (ps.page - 1) * ps.pageSize;
    const pageGroups = groupOrder.slice(start, start + ps.pageSize);

    if (!groupOrder.length) {
      body.innerHTML = '<tr><td colspan="8" class="empty">Sin movimientos.</td></tr>';
      renderPagination('movementsPagination', 0, 1, ps.pageSize, goMovementsPage);
      return;
    }

    // 3. RENDER PAGE GROUPS
    let html = '';
    pageGroups.forEach(gid => {
      const items = groups[gid];
      const first = items[0];
      const totalUnits = items.reduce((s, m) => s + Number(m.cantidad||0), 0);
      const movId = first.movementGroupId || '';
      const rowId = 'grp_' + gid.replace(/[^a-z0-9]/gi,'_');

  function updateProductStock(rowId) {
    const tbody = document.getElementById('productRowsBody');
    const tr = tbody.querySelector(`tr[data-row-id="${rowId}"]`);
    if (!tr) return;
    const sel = tr.querySelector('.mv-product-select');
    const qtyInput = tr.querySelector('.mv-qty');
    const badge = document.getElementById('stockBadge_' + rowId);
    if (!sel || !badge) return;

    const codigo = sel.value;
    if (!codigo) { badge.textContent = '—'; badge.className = 'stock-badge'; return; }

    const inv = state.inventory.find(i => i.codigo === codigo);
    const stock = inv ? inv.stock : 0;
    const qty = Number(qtyInput ? qtyInput.value : 1);
    const tipo = document.getElementById('mvTipo') ? document.getElementById('mvTipo').value : 'SALIDA';
    const isSalida = ['SALIDA','AJUSTE_NEGATIVO'].includes(tipo);

    badge.textContent = stock;
    badge.className = 'stock-badge' + (stock <= 0 ? ' out' : (isSalida && qty > stock ? ' warn' : (stock <= 3 ? ' low' : '')));
  }

  function _collectProductRows() {
    const rows = [];
    document.querySelectorAll('#productRowsBody tr').forEach(tr => {
      const sel = tr.querySelector('.mv-product-select');
      const qty = tr.querySelector('.mv-qty');
      const cond = tr.querySelector('.mv-condicion');
      if (sel && qty) {
        rows.push({
          rowId: tr.dataset.rowId,
          codigo: sel.value,
          cantidad: Number(qty.value),
          condicion: cond ? cond.value : 'NUEVO',
          _sel: sel,
          _qty: qty
        });
      }
    });
    return rows;
  }

  function validateMovementForm(rows) {
    const errors = [];
    const tipo = document.getElementById('mvTipo').value;
    const isSalida = ['SALIDA','AJUSTE_NEGATIVO'].includes(tipo);

    // General fields
    if (!document.getElementById('mvFecha').value) errors.push('La fecha es obligatoria.');
    if (!tipo) errors.push('El tipo de movimiento es obligatorio.');

    if (!rows.length) { errors.push('Agrega al menos un producto.'); return errors; }

    // Product rows
    const seenCodigos = {};
    rows.forEach((r, idx) => {
      if (!r.codigo) { errors.push(`Fila ${idx+1}: Selecciona un producto.`); return; }
      if (!(r.cantidad > 0)) { errors.push(`Fila ${idx+1}: La cantidad debe ser mayor que 0.`); return; }
      if (!Number.isInteger(r.cantidad)) { errors.push(`Fila ${idx+1}: La cantidad debe ser un número entero.`); return; }

      // Duplicate check
      const key = r.codigo + '|' + r.condicion;
      if (seenCodigos[key] !== undefined) {
        errors.push(`El producto ${r.codigo} (${r.condicion}) ya fue agregado. Consolida las cantidades o usa condiciones diferentes.`);
      } else {
        seenCodigos[key] = idx;
      }

      // Stock check for salidas
      if (isSalida) {
        const inv = state.inventory.find(i => i.codigo === r.codigo);
        const available = inv ? inv.stock : 0;
        const p = state.products.find(x => x.codigo === r.codigo);
        const name = p ? (p.tipo + (p.modelo?' · '+p.modelo:'')) : r.codigo;
        if (available < r.cantidad) {
          errors.push(`Stock insuficiente para "${name}". Disponible: ${available}. Solicitado: ${r.cantidad}.`);
        }
      }
    });
    return errors;
  }

  function updateStockCorrectionPreview() {
    const sa = document.getElementById('stockActualEdit');
    const sn = document.getElementById('stockNuevoEdit');
    const preview = document.getElementById('stockCorrectionPreview');
    if (!sa || !sn || !preview || preview.style.display === 'none') return;

    const actual = Number(sa.value || 0);
    const nuevo = Number(sn.value || 0);
    const delta = nuevo - actual;
    const reorderInput = document.querySelector('input[name="puntoReorden"]');
    const reorder = Number(reorderInput ? reorderInput.value || 0 : 0);
    const estado = stockStatus(nuevo, reorder, Number(document.querySelector('input[name="stockMaximo"]')?.value || 0));

    const deltaEl = document.getElementById('stockPreviewDelta');
    const estadoEl = document.getElementById('stockPreviewEstado');
    document.getElementById('stockPreviewActual').textContent = fmt(actual);
    document.getElementById('stockPreviewNuevo').textContent = fmt(nuevo);
    deltaEl.textContent = (delta > 0 ? '+' : '') + fmt(delta);
    deltaEl.style.fontWeight = '800';
    estadoEl.textContent = estado === 'NORMAL' ? '🟢 NORMAL' : estado === 'STOCK BAJO' ? '🟡 STOCK BAJO' : '🔴 AGOTADO';
    estadoEl.style.fontWeight = '800';
  }

  function editProduct(codigo) {
    const product = state.products.find(p => p.codigo === codigo);
    if (!product) return;
    const inv = state.inventory.find(i => i.codigo === codigo);
    const currentStock = inv ? Number(inv.stock || 0) : 0;

    // Fill the form fields with product data
    document.getElementById('originalCodigo').value = product.codigo;
    document.getElementById('prCategoria').value = product.categoria || '';
    document.getElementById('prNaturaleza').value = product.naturaleza || 'INVENTARIABLE';
    document.getElementById('prTipo').value = product.tipo || '';
    document.getElementById('prModelo').value = product.modelo || '';
    document.getElementById('prMarca').value = product.marca || '';
    document.getElementById('prColor').value = product.color || '';
    document.getElementById('prTalla').value = product.talla === 'NO APLICA' ? '' : (product.talla || '');
    document.getElementById('prPresentacion').value = product.presentacion === 'NO APLICA' ? '' : (product.presentacion || '');
    document.getElementById('prGenero').value = product.genero || 'NO APLICA';
    document.getElementById('prUnidad').value = product.unidad || 'UNIDAD';
    document.getElementById('prCondicion').value = product.condicion || 'NUEVO';
    
    const ub = document.querySelector('input[name="ubicacion"]');
    if (ub) ub.value = product.ubicacion || '';

    // Stock: se muestra y puede corregirse mediante un ajuste trazable en Kardex.
    const sa = document.getElementById('stockActualEdit');
    const sn = document.getElementById('stockNuevoEdit');
    if (sa) sa.value = currentStock;
    if (sn) sn.value = currentStock;

  function kardexProductHaystack(p) {
    return stripAccents([p.codigo, p.tipo, p.modelo, p.marca, p.color, p.talla, p.presentacion, p.genero, p.unidad, p.categoria, p.naturaleza, p.ubicacion].join(' ')).toLowerCase();

  function searchKardexProducts(query) {
    var q = stripAccents(String(query || '').trim()).toLowerCase();
    var box = document.getElementById('kxSearchResults');
    var clear = document.getElementById('kxSearchClear');
    if (clear) clear.style.display = q ? '' : 'none';
    kardexSearchIndex = -1;
    if (!box) return;
    if (!q) {
      renderKardexRecent();
      box.classList.add('hidden');
      var hidden = document.getElementById('kxCodigo');
      var selected = document.getElementById('kxSelected');
      var productBox = document.getElementById('kardexProduct');
      var stockBox = document.getElementById('kxStock');
      var table = document.getElementById('kardexTable');
      if (hidden) hidden.value = '';
      if (selected) { selected.classList.add('hidden'); selected.innerHTML = ''; }
      if (productBox) { productBox.classList.add('hidden'); productBox.innerHTML = ''; }
      if (stockBox) stockBox.innerHTML = '';
      if (table) table.innerHTML = '<tr><td colspan="14" class="empty">Busca y selecciona un producto para consultar sus movimientos.</td></tr>';
      return;
    }
    var terms = q.split(/\s+/).filter(Boolean);
    var results = (state.products || []).filter(function(p) {
      var hay = kardexProductHaystack(p);
      return terms.every(function(t) { return hay.includes(t); });
    }).slice(0, 20);
    if (!results.length) {
      box.innerHTML = '<div class="kardex-search-empty">No encontramos productos con <strong>' + esc(query) + '</strong>.</div>';
    } else {
      box.innerHTML = results.map(function(p, idx) {
        var inv = getKardexInventory(p.codigo);
        var stock = Number(inv.stock || 0);
        var status = inv.estado || stockStatus(stock, Number(p.puntoReorden || p.reorderPoint || 0), Number(p.stockMaximo || p.stockMax || 0));
        return '<button type="button" class="kardex-result-item" data-index="' + idx + '" onclick="selectKardexProduct(\'' + js(p.codigo) + '\')">' +
          '<span class="kardex-result-main"><strong>' + esc(p.codigo) + '</strong><span>' + esc([p.tipo, p.marca, p.modelo, p.color, p.talla || p.presentacion].filter(Boolean).join(' · ') || 'Producto') + '</span></span>' +
          '<span class="kardex-result-stock"><strong>' + fmt(stock) + ' ' + esc(p.unidad || 'UNIDAD') + '</strong><span>' + statusPill(status) + '</span></span>' +
        '</button>';
      }).join('');
    }
    box.classList.remove('hidden');
  }

  function handleKardexSearchKey(ev) {
    var box = document.getElementById('kxSearchResults');
    if (!box || box.classList.contains('hidden')) return;
    var items = box.querySelectorAll('.kardex-result-item');
    if (ev.key === 'ArrowDown') { ev.preventDefault(); kardexSearchIndex = Math.min(kardexSearchIndex + 1, items.length - 1); }
    else if (ev.key === 'ArrowUp') { ev.preventDefault(); kardexSearchIndex = Math.max(kardexSearchIndex - 1, 0); }
    else if (ev.key === 'Enter' && kardexSearchIndex >= 0 && items[kardexSearchIndex]) { ev.preventDefault(); items[kardexSearchIndex].click(); return; }
    else if (ev.key === 'Escape') { box.classList.add('hidden'); return; }
    items.forEach(function(el, i) { el.classList.toggle('active', i === kardexSearchIndex); });
  }

  function applyProductTypeMeta() {
    var raw = (document.getElementById('prTipo') || {}).value || ''; var key = stripAccents(raw).toUpperCase(); var meta = TYPE_META[key];
    var model = document.getElementById('prModelo'), cat = document.getElementById('prCategoria'), nat = document.getElementById('prNaturaleza'), gen = document.getElementById('prGenero'), unit = document.getElementById('prUnidad');

  function updateSkuPreview() {
    const type = document.getElementById('prTipo')?.value || '', model = document.getElementById('prModelo')?.value || '', brand = document.getElementById('prMarca')?.value || '', color = document.getElementById('prColor')?.value || '', talla = document.getElementById('prTalla')?.value || '', pres = document.getElementById('prPresentacion')?.value || '';
    const preview = document.getElementById('skuPreview'); if (!preview) return;
    if (!type) { preview.textContent = 'Completa Tipo / Producto'; return; }
    preview.textContent = buildSkuPreview(type, model || brand, color, talla, pres);
  }
  function buildSkuPreview(type, model, color, talla, pres) {
    const mapType = { 'BORCEGUIES': 'BOR', 'CORREA': 'COR', 'MANGAS': 'MGA', 'MANGA': 'MGA', 'CHALECO TACTICO': 'CHA', 'CHALECO TÁCTICO': 'CHA', 'CHALECO ANTIBALAS': 'ABA', 'CASACA': 'CAS', 'CHOMPA JORGE CHAVEZ': 'CHO', 'CHOMPA JORGE CHÁVEZ': 'CHO', 'CAFARENA': 'CAF', 'POLO': 'POL', 'POLOS': 'POL', 'SOMBRERO': 'SOM', 'POLACA': 'POL', 'CHALECO DE FAENA': 'CHA', 'CAMISA': 'CAM', 'PANTALÓN': 'PAN', 'PANTALON': 'PAN', 'ZAPATO': 'ZAP', 'BOTA': 'BOT', 'GUANTE': 'GUA', 'GORRA': 'GOR', 'GORRO': 'GOR', 'CINTURÓN': 'CIN', 'CINTURON': 'CIN', 'ESCOBAS': 'ESCO', 'ESCOBA': 'ESCO', 'RECOGEDORES': 'REC', 'RECOGEDOR': 'REC', 'TRAPEADORES': 'TRA', 'TRAPEADOR': 'TRA', 'BALDES': 'BAL', 'BALDE': 'BAL', 'TRAPOS INDUSTRIALES': 'TRI', 'DETERGENTE': 'DET', 'LEJÍA': 'LEJ', 'LEJIA': 'LEJ', 'ÁCIDO MURIÁTICO': 'ACI', 'ACIDO MURIATICO': 'ACI', 'JABÓN LÍQUIDO': 'JAB', 'JABON LIQUIDO': 'JAB', 'AMBIENTADOR': 'AMB', 'KRESO': 'KRE', 'ISOPO DE BAÑO': 'ISO' };
    const mapModel = { 'INSTITUCIONAL': 'INS', 'TACTICO': 'TAC', 'TÁCTICO': 'TAC', 'FAENA': 'FAE', 'PROTECCION': 'PRO', 'PROTECCIÓN': 'PRO', 'ANTIBALAS': 'ANT', 'JORGE CHAVEZ': 'JCH', 'JORGE CHÁVEZ': 'JCH', 'LIMPIEZA': 'LIM', 'LIQUIDO': 'LIQ', 'LÍQUIDO': 'LIQ', 'BAÑO': 'BAN', 'ÁCIDO': 'ACI', 'ACIDO': 'ACI', 'DESINFECTANTE': 'DES', 'INODORO': 'INO' };
    const mapColor = { 'NEGRO': 'NEG', 'AZUL': 'AZU', 'BLANCO': 'BLA', 'ROJO': 'ROJ', 'VERDE': 'VER', 'GRIS': 'GRI', 'MARRON': 'MAR', 'MARRÓN': 'MAR', 'BEIGE': 'BEI', 'AMARILLO': 'AMA', 'NARANJA': 'NAR', 'CELESTE': 'CEL' };
    const token = (value, map, fallback) => { const s = stripAccents(value).trim().toUpperCase(); if (!s) return fallback; if (map[s]) return map[s]; return s.replace(/[^A-Z0-9]/g, '').slice(0, 3) || fallback; };
    let variant = (talla || '').trim().toUpperCase(); if (!variant || ['NO APLICA', 'N/A', 'NA'].includes(stripAccents(variant).trim())) variant = (pres || '').trim().toUpperCase();
    variant = variant.replace(/\s+/g, ''); if (['NOAPLICA', 'N/A', 'NA'].includes(stripAccents(variant))) variant = '';
    variant = variant === 'UNICA' || variant === 'ÚNICA' ? 'UNI' : (variant === 'SINTALLA' ? 'ST' : variant); variant = stripAccents(variant).replace(/[^A-Z0-9.-]/g, '') || 'STD';
    return [token(type, mapType, 'TIP'), token(model, mapModel, 'GEN'), token(color, mapColor, 'GEN'), variant].join('-');
  }
  function stripAccents(v) { return String(v || '').normalize('NFD').replace(/[\u0300-\u036f]/g, ''); }

  document.addEventListener('input', function(ev) {
    if (ev.target && ['stockNuevoEdit', 'puntoReorden', 'stockMaximo'].includes(ev.target.id || ev.target.name)) {
      updateStockCorrectionPreview();
    }
  });

  function updateProductStats() {
    // Las tarjetas cuentan productos/SKUs realmente registrados en el catálogo.
    // No cuentan las opciones disponibles del formulario.
    const products = Array.isArray(state.products) ? state.products : [];
    const inventariables = products.filter(p => String(p.naturaleza || '').toUpperCase() === 'INVENTARIABLE').length;
    const consumibles = products.filter(p => String(p.naturaleza || '').toUpperCase() === 'CONSUMIBLE').length;
    const families = new Set(products.map(p => String(p.categoria || '').trim()).filter(Boolean)).size;
    const a = document.getElementById('prStatInv'); if (a) a.textContent = fmt(inventariables);
    const b = document.getElementById('prStatCons'); if (b) b.textContent = fmt(consumibles);
    const c = document.getElementById('prStatFamilies'); if (c) c.textContent = fmt(families);
  }

  function filterProductsByNature(nature) {
    const select = document.getElementById('productNatureFilter');
    const search = document.getElementById('productSearch');
    if (select) select.value = nature || '';
    if (search) search.value = '';
    paginationState.products.page = 1; // reset to page 1 on filter change
    renderProducts();
    const panel = document.getElementById('productsTable');
    if (panel) panel.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  /** Called by oninput/onchange in Index.html for product filters — resets page */
  function onProductFilterChange() {
    paginationState.products.page = 1;
    renderProducts();
  }

  /** Called by oninput/onchange in Index.html for inventory filters — resets page */
  function onInventoryFilterChange() {
    paginationState.inventory.page = 1;
    renderInventory();
  }

  function focusProductFamilies() {
    const select = document.getElementById('productFamilyFilter');
    if (select) {
      select.focus();
      select.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
  }

  function rowInventory(i) {
    return `<tr><td><strong>${esc(i.codigo)}</strong></td><td>${esc(i.tipo)}</td><td>${esc(i.talla)}</td><td>${fmt(i.stock)}</td><td>${statusPill(i.estado)}</td></tr>`;
  }
  function rowInventoryFull(i) {
    return `<tr><td><strong>${esc(i.codigo)}</strong></td><td>${esc(i.tipo)}</td><td>${esc(i.modelo)}</td><td>${esc(i.color)}</td><td>${esc(i.talla)}</td><td>${esc(i.unidad)}</td><td><strong>${fmt(i.stock)}</strong></td><td>${fmt(i.stockMin)}</td><td>${statusPill(i.estado)}</td><td><button class="btn btn-secondary" onclick="openProductDetail('${js(i.codigo)}')">Ver detalle</button></td></tr>`;
  }
  function naturePill(s) { const cls = s === 'CONSUMIBLE' ? 'nature-consumible' : 'nature-inventariable'; return `<span class="nature-pill ${cls}">${esc(s || 'INVENTARIABLE')}</span>`; }
  function statusPill(s) { const cls = s === 'NORMAL' ? 'normal' : (s === 'SOBRESTOCK' ? 'over' : (['REORDENAR', 'STOCK BAJO'].includes(s) ? 'low' : 'out')); return `<span class="status ${cls}">${esc(s)}</span>`; }
  function moveLabel(t) { const map = { ENTRADA: 'Entrada', SALIDA: 'Salida', DEVOLUCION: 'Devolución', AJUSTE_POSITIVO: 'Ajuste +', AJUSTE_NEGATIVO: 'Ajuste −', SALDO_INICIAL: 'Saldo inicial' }; return map[t] || esc(t); }
  function qtyView(m) { const sign = ['ENTRADA', 'SALDO_INICIAL', 'AJUSTE_POSITIVO'].includes(m.tipoMovimiento) ? '+' : '−'; const cls = sign === '+' ? 'move-in' : 'move-out'; return `<span class="${cls}">${sign} ${fmt(m.cantidad)}</span>`; }
  function fmt(v) { return Number(v || 0).toLocaleString('es-PE', { maximumFractionDigits: 2 }); }
  function setToday() { const today = new Intl.DateTimeFormat('en-CA', { timeZone: 'America/Lima' }).format(new Date()); const el = document.getElementById('mvFecha'); if (el) el.value = today; }
  function toast(msg) { const el = document.getElementById('toast'); el.textContent = msg; el.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), 3200); }
  function handleError(err) { showLoading(false); toast((err && err.message) ? err.message : String(err)); }
  function showLoading(show) { document.getElementById('loading').style.display = show ? 'flex' : 'none'; }
  function closeModal() { document.getElementById('modal').classList.add('hidden'); }
  function esc(v) { return String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
  function escAttr(v) { return esc(v); }
  function js(v) { return String(v ?? '').replace(/\\/g, '\\\\').replace(/'/g, "\\'"); }
  function openProductCode(code) {
    var p = state.products.find(function (x) { return x.codigo === code; });
    if (!p) { toast('Producto no encontrado.'); return; }
    var bc = p.barcodeUrl || ('https://barcode.tec-it.com/barcode.ashx?data=' + encodeURIComponent(p.codigo) + '&code=Code128&translate-esc=true');
    var qr = p.qrUrl || ('https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=' + encodeURIComponent(p.codigo));
    var mt = document.getElementById('modalTitle'); if (mt) mt.textContent = 'Identificacion · ' + p.codigo;
    var mb = document.getElementById('modalBody'); if (!mb) return;
    var mm = [p.tipo, p.categoria, p.naturaleza, [p.marca, p.modelo].filter(Boolean).join(' · '), p.color || '—', p.talla || p.presentacion || '—'].map(esc).join(' · ');
    var pres = esc(p.presentacion || 'NO APLICA');
    var und = esc(p.unidad);
    var cod = esc(p.codigo);
    var bcA = escAttr(bc), qrA = escAttr(qr);
    var h = '';
    h += '<div class="code-card">';
    h += '<div class="code-meta"><strong>' + cod + '</strong><span>' + mm + '</span></div>';
    h += '<div class="code-grid">';
    h += '<div><div class="code-label">Codigo de barras</div><img class="barcode-img" src="' + bcA + '" alt="Codigo de barras"><a class="btn btn-secondary" href="' + bcA + '" target="_blank">Abrir</a></div>';
    h += '<div><div class="code-label">Codigo QR</div><img class="qr-img" src="' + qrA + '" alt="QR"><a class="btn btn-secondary" href="' + qrA + '" target="_blank">Abrir</a></div>';
    h += '</div>';
    h += '<div class="scan-note">Un lector de codigos puede enviar el SKU como teclado. Presentacion: <strong>' + pres + '</strong> · Unidad: <strong>' + und + '</strong>.</div>';
    h += '</div>';
    mb.innerHTML = h;
    var m = document.getElementById('modal'); if (m) m.classList.remove('hidden');
  }

</script>
