<style>

  :root {
    --bg: #f4f6f8;
    --panel: #fff;
    --text: #17202a;
    --muted: #6b7684;
    --line: #e5e9ee;
    --primary: #0f766e;
    --primary-dark: #0b5d57;
    --warning: #c98a00;
    --danger: #b42318;
    --shadow: 0 10px 30px rgba(16, 24, 40, .06)
  }

  * {
    box-sizing: border-box
  }

  body {
    margin: 0;
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    background: var(--bg);
    color: var(--text)
  }

  button,
  input,
  select,
  textarea {
    font: inherit
  }

  .app-shell {
    display: flex;
    min-height: 100vh
  }

  .sidebar {
    width: 260px;
    background: #10222d;
    color: #fff;
    padding: 22px 16px;
    display: flex;
    flex-direction: column;
    position: sticky;
    top: 0;
    height: 100vh
  }

  .brand {
    display: flex;
    gap: 12px;
    align-items: center;
    padding: 8px 8px 26px
  }

  .brand-mark {
    width: 38px;
    height: 38px;
    border-radius: 11px;
    background: #e4f5f2;
    color: #0f766e;
    display: grid;
    place-items: center;
    font-weight: 800
  }

  .brand-title {
    font-weight: 800
  }

  .brand-subtitle {
    font-size: 12px;
    color: #a9b8c4;
    margin-top: 2px
  }

  .nav {
    display: flex;
    flex-direction: column;
    gap: 5px
  }

  .nav-item {
    border: 0;
    background: transparent;
    color: #d5dee4;
    text-align: left;
    padding: 11px 12px;
    border-radius: 9px;
    cursor: pointer;
    display: flex;
    gap: 10px;
    align-items: center
  }

  .nav-item:hover,
  .nav-item.active {
    background: #1c3948;
    color: #fff
  }

  .nav-item span {
    width: 22px;
    text-align: center
  }

  .sidebar-footer {
    margin-top: auto;
    font-size: 12px;
    color: #a9b8c4
  }

  .sheet-link {
    display: block;
    color: #cfe9e5;
    text-decoration: none;
    padding: 10px 8px
  }

  .sheet-link:hover {
    text-decoration: underline
  }

  .version {
    padding: 0 8px
  }

  .main {
    flex: 1;
    min-width: 0
  }

  .topbar {
    height: 86px;
    background: rgba(255, 255, 255, .95);
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 32px;
    position: sticky;
    top: 0;
    z-index: 10
  }

  .eyebrow {
    font-size: 11px;
    font-weight: 800;
    letter-spacing: .11em;
    color: var(--muted)
  }

  h1 {
    font-size: 25px;
    margin: 3px 0 0
  }

  h2 {
    margin: 0 0 5px;
    font-size: 23px
  }

  h3 {
    margin: 0;
    font-size: 16px
  }

  .topbar-actions,
  .actions,
  .form-actions {
    display: flex;
    gap: 10px;
    align-items: center
  }

  .badge {
    font-size: 12px;
    padding: 8px 11px;
    border-radius: 999px;
    background: #eaf5f3;
    color: var(--primary);
    font-weight: 700
  }


  /* Dashboard operativo */
  .dashboard-head{display:flex;justify-content:space-between;align-items:flex-end;gap:18px;margin-bottom:18px}
  .dashboard-head h2{margin:3px 0 3px;font-size:25px}
  .dashboard-head p{margin:0;color:var(--muted)}
  .dashboard-actions{display:flex;align-items:center;gap:9px}
  .dashboard-period{font-size:11px;font-weight:800;color:var(--muted);background:#f1f4f6;border:1px solid var(--line);border-radius:999px;padding:9px 11px}
  .dashboard-kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-bottom:16px}
  .dash-kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:15px;display:flex;gap:12px;align-items:center;min-width:0;box-shadow:var(--shadow)}
  .dash-kpi.warning{border-top:3px solid #d89b12}.dash-kpi.danger{border-top:3px solid #d94b45}
  .dash-kpi-icon{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;font-size:18px;flex:0 0 auto}
  .dash-kpi-icon.teal{background:#e8f7f4;color:#0f766e}.dash-kpi-icon.blue{background:#eaf2ff;color:#2563eb}.dash-kpi-icon.amber{background:#fff5d9;color:#a96e00}.dash-kpi-icon.red{background:#fff0ef;color:#b42318}.dash-kpi-icon.purple{background:#f2eafd;color:#7c3aed}
  .dash-kpi-label{font-size:9px;font-weight:900;color:var(--muted);letter-spacing:.06em;white-space:nowrap}.dash-kpi-value{font-size:23px;font-weight:900;line-height:1.15;margin-top:3px}.dash-kpi-sub{font-size:10px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .dashboard-grid{display:grid;gap:16px;margin-bottom:16px}.dashboard-grid.top{grid-template-columns:1.45fr .85fr}.dashboard-grid.middle{grid-template-columns:1.15fr .85fr}.dashboard-grid.bottom{grid-template-columns:1fr 1fr}
  .dashboard-panel{margin-bottom:0}.metric-tag{font-size:10px;font-weight:900;color:var(--primary);background:#eaf6f4;border-radius:999px;padding:6px 9px;white-space:nowrap}
  .category-bars{padding:17px 18px 16px}.cat-row{display:grid;grid-template-columns:130px 1fr 58px;gap:10px;align-items:center;margin-bottom:13px}.cat-row:last-child{margin-bottom:0}.cat-name{font-size:11px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.cat-track{height:10px;background:#edf1f3;border-radius:999px;overflow:hidden}.cat-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,#16b7b0,#1597d0)}.cat-value{text-align:right;font-size:11px;font-weight:900}
  .inventory-health{padding:19px;display:flex;align-items:center;justify-content:center;gap:30px;min-height:185px}.health-donut{width:142px;height:142px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(#19b978 0deg 240deg,#e8b53e 240deg 305deg,#df5b65 305deg 360deg);position:relative;flex:0 0 auto}.health-donut:after{content:"";position:absolute;inset:18px;background:#fff;border-radius:50%}.health-donut>div{position:relative;z-index:1;text-align:center}.health-donut strong{display:block;font-size:23px}.health-donut span{font-size:8px;font-weight:900;color:var(--muted);letter-spacing:.06em}.health-legend{min-width:150px}.health-legend>div{display:grid;grid-template-columns:12px 1fr auto;gap:7px;align-items:center;margin:10px 0;font-size:11px}.health-legend strong{font-size:12px}.legend-dot{width:9px;height:9px;border-radius:50%}.legend-dot.normal{background:#19b978}.legend-dot.low{background:#e8b53e}.legend-dot.out{background:#df5b65}
  .movement-chart{padding:16px 18px 17px}.movement-chart-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:10px;align-items:end;height:180px;border-bottom:1px solid var(--line);padding:10px 4px 0}.movement-day{height:100%;display:flex;align-items:flex-end;justify-content:center;gap:4px;position:relative}.movement-bars{height:145px;display:flex;align-items:flex-end;gap:4px}.movement-bar{width:13px;border-radius:4px 4px 0 0;min-height:3px}.movement-bar.in{background:#22b8b1}.movement-bar.out{background:#e66b72}.movement-label{position:absolute;bottom:-23px;font-size:9px;color:var(--muted)}.movement-legend{display:flex;gap:14px;margin-top:25px;font-size:10px;color:var(--muted)}.movement-legend span{display:inline-flex;align-items:center;gap:5px}.movement-legend i{width:8px;height:8px;border-radius:2px;display:inline-block}.movement-legend .in{background:#22b8b1}.movement-legend .out{background:#e66b72}
  .top-products{padding:14px 18px}.top-product{display:grid;grid-template-columns:25px 1fr 80px;gap:9px;align-items:center;padding:9px 0;border-bottom:1px solid #eef1f3}.top-product:last-child{border-bottom:0}.rank{font-weight:900;color:var(--muted);font-size:11px}.top-product-name{font-size:11px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.top-product-meta{font-size:9px;color:var(--muted);margin-top:2px}.top-stock{text-align:right;font-size:12px;font-weight:900}.top-stock small{display:block;font-size:9px;color:var(--muted);font-weight:700}
  .dashboard-panel table{min-width:620px}.dashboard-panel th,.dashboard-panel td{padding:10px 12px;font-size:11px}.dashboard-panel th{font-size:9px}.dashboard-panel .status-pill{font-size:9px;padding:4px 7px}
  @media(max-width:1200px){.dashboard-kpis{grid-template-columns:repeat(3,1fr)}.dashboard-grid.top,.dashboard-grid.middle,.dashboard-grid.bottom{grid-template-columns:1fr 1fr}}
  @media(max-width:850px){.dashboard-head{flex-direction:column;align-items:flex-start}.dashboard-kpis{grid-template-columns:repeat(2,1fr)}.dashboard-grid.top,.dashboard-grid.middle,.dashboard-grid.bottom{grid-template-columns:1fr}.inventory-health{justify-content:flex-start}}
  .section {
    display: none;
    padding: 28px 32px 40px
  }

  .section.active {
    display: block
  }

  .section-head {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 16px;
    margin-bottom: 20px
  }

  .section-head p {
    margin: 0;
    color: var(--muted)
  }

  .btn {
    border: 0;
    border-radius: 9px;
    padding: 10px 14px;
    cursor: pointer;
    font-weight: 700
  }

  .btn-primary {
    background: var(--primary);
    color: white
  }

  .btn-primary:hover {
    background: var(--primary-dark)
  }

  .btn-secondary {
    background: #eef2f5;
    color: #2c3a46
  }

  .cards {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 14px;
    margin-bottom: 18px
  }

  .metric-card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 19px;
    display: flex;
    gap: 14px;
    align-items: center;
    box-shadow: var(--shadow)
  }

  .metric-icon {
    width: 42px;
    height: 42px;
    border-radius: 11px;
    display: grid;
    place-items: center;
    background: #eaf5f3;
    color: var(--primary);
    font-size: 20px
  }

  .metric-card.warning .metric-icon {
    background: #fff6da;
    color: var(--warning)
  }

  .metric-card.danger .metric-icon {
    background: #fff0ef;
    color: var(--danger)
  }

  .metric-label {
    color: var(--muted);
    font-size: 12px;
    margin-bottom: 4px
  }

  .metric-value {
    font-size: 26px;
    font-weight: 800
  }

  .grid-2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 18px
  }

  .panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    box-shadow: var(--shadow);
    overflow: hidden;
    margin-bottom: 18px
  }

  .panel-head {
    padding: 16px 18px;
    border-bottom: 1px solid var(--line);
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px
  }

  .muted {
    color: var(--muted);
    font-size: 12px
  }

  .table-wrap {
    overflow: auto
  }

  table {
    width: 100%;
    border-collapse: collapse;
    min-width: 940px
  }

  th,
  td {
    padding: 12px 14px;
    border-bottom: 1px solid var(--line);
    text-align: left;
    font-size: 13px;
    white-space: nowrap
  }

  th {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .05em;
    color: var(--muted);
    background: #fbfcfd;
    position: sticky;
    top: 0;
    z-index: 1
  }

  tr:last-child td {
    border-bottom: 0
  }

  .status {
    display: inline-flex;
    align-items: center;
    padding: 5px 8px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 800
  }

  .status.normal {
    background: #eaf7ef;
    color: #157347
  }

  .status.low {
    background: #fff6da;
    color: #8a5c00
  }

  .status.out {
    background: #fff0ef;
    color: #a61b10
  }

  .status.over {
    background: #eeeafd;
    color: #5742a4
  }

  .move-in {
    color: #157347;
    font-weight: 800
  }

  .move-out {
    color: #b42318;
    font-weight: 800
  }

  .input {
    width: 100%;
    border: 1px solid #d7dde4;
    background: #fff;
    border-radius: 9px;
    padding: 10px 11px;
    outline: none
  }

  .input:focus {
    border-color: #8bc7c0;
    box-shadow: 0 0 0 3px rgba(15, 118, 110, .10)
  }

  .select {
    cursor: pointer
  }

  .toolbar {
    display: flex;
    gap: 10px;
    margin-bottom: 14px
  }

  .toolbar .input {
    max-width: 560px
  }

  .toolbar .select {
    max-width: 220px
  }

  .form-panel {
    padding: 20px
  }

  .form-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 14px
  }

  .form-grid.compact {
    grid-template-columns: 2fr 1fr 1fr auto
  }

  .form-grid label {
    font-size: 12px;
    color: #52606d;
    font-weight: 700
  }

  .form-grid .input {
    margin-top: 6px;
    color: var(--text);
    font-weight: 500
  }

  .full {
    grid-column: 1/-1
  }

  .form-actions {
    justify-content: flex-end;
    margin-top: 18px
  }

  .align-end {
    display: flex;
    align-items: end
  }

  .kardex-search-panel {
    position: relative;
    z-index: 20;
    overflow: visible; /* permite que los resultados del buscador salgan fuera del panel */
  }
  .kardex-search-box {
    position: relative;
    z-index: 30;
  }
  .kardex-search-head {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 12px;
  }
  .kardex-search-head strong { display:block; font-size:13px; }
  .kardex-search-head .muted { display:block; margin-top:3px; font-size:11px; }
  .kardex-search-row {
    display:grid;
    grid-template-columns:minmax(320px, 2fr) 150px 150px auto;
    gap:10px;
    align-items:end;
  }
  .kardex-search-box > .input { padding-left:38px; padding-right:34px; }
  .kardex-search-icon {
    position:absolute; left:13px; bottom:12px; z-index:2; font-size:15px; pointer-events:none;
  }
  .kardex-clear {
    position:absolute; right:8px; bottom:7px; border:0; background:transparent; color:var(--muted);
    width:28px; height:28px; border-radius:50%; cursor:pointer; font-size:20px; line-height:1;
  }
  .kardex-clear:hover { background:#eef2f4; color:var(--text); }
  .kardex-search-results {
    position:absolute; left:0; right:0; top:calc(100% + 5px); background:#fff; border:1px solid var(--line);
    border-radius:12px; box-shadow:0 12px 30px rgba(15,23,42,.14); overflow:hidden; max-height:360px; overflow-y:auto;
    z-index:50;
  }
  .kardex-result-item {
    width:100%; border:0; border-bottom:1px solid #edf1f3; background:#fff; text-align:left; padding:11px 13px;
    cursor:pointer; display:flex; justify-content:space-between; gap:12px; align-items:center;
  }
  .kardex-result-item:last-child { border-bottom:0; }
  .kardex-result-item:hover, .kardex-result-item.active { background:#f0f8f6; }
  .kardex-result-main strong { display:block; color:var(--text); font-size:12px; }
  .kardex-result-main span { display:block; color:var(--muted); font-size:11px; margin-top:3px; }
  .kardex-result-stock { text-align:right; white-space:nowrap; }
  .kardex-result-stock strong { display:block; font-size:12px; }
  .kardex-result-stock span { display:block; font-size:10px; margin-top:3px; }
  .kardex-search-empty { padding:18px; text-align:center; color:var(--muted); font-size:12px; }
  .kardex-recent { display:flex; gap:7px; flex-wrap:wrap; margin-top:10px; align-items:center; }
  .kardex-recent-label { font-size:10px; color:var(--muted); font-weight:800; text-transform:uppercase; margin-right:2px; }
  .kardex-recent-chip {
    border:1px solid var(--line); background:#fff; color:var(--text); border-radius:999px; padding:6px 10px;
    cursor:pointer; font-size:10px; font-weight:800;
  }
  .kardex-recent-chip:hover { border-color:#0f766e; color:#0f766e; }
  .kardex-selected {
    margin-top:10px; padding:9px 11px; border-radius:10px; border:1px solid #cbe8e3; background:#eef7f5;
    font-size:11px; color:#245b55;
  }
  .kardex-selected strong { color:#0f766e; }
  .kardex-date-field { font-size:12px; color:#52606d; font-weight:700; }
  .kardex-date-field .input { margin-top:6px; }
  @media (max-width: 900px) {
    .kardex-search-row { grid-template-columns:1fr 1fr; }
    .kardex-search-box { grid-column:1/-1; }
    .kardex-search-row .align-end { justify-content:flex-end; }
  }
  @media (max-width: 560px) {
    .kardex-search-row { grid-template-columns:1fr; }
    .kardex-search-box { grid-column:auto; }
  }

  .product-summary {
    background: #eef7f5;
    border: 1px solid #cbe8e3;
    padding: 14px 16px;
    border-radius: 12px;
    margin-bottom: 18px
  }

  .product-summary strong {
    color: var(--primary)
  }

  .empty {
    text-align: center;
    color: var(--muted);
    padding: 30px !important
  }

  .small {
    max-width: 220px
  }

  .loading-overlay {
    position: fixed;
    inset: 0;
    background: rgba(255, 255, 255, .78);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 100;
    font-weight: 700;
    color: #334155
  }

  .spinner {
    width: 38px;
    height: 38px;
    border: 4px solid #e4eaee;
    border-top-color: var(--primary);
    border-radius: 50%;
    animation: spin .8s linear infinite;
    margin-bottom: 10px
  }

  @keyframes spin {
    to {
      transform: rotate(360deg)
    }
  }

  .toast {
    position: fixed;
    right: 24px;
    bottom: 24px;
    background: #18232d;
    color: #fff;
    padding: 12px 15px;
    border-radius: 10px;
    box-shadow: 0 12px 35px rgba(0, 0, 0, .2);
    opacity: 0;
    transform: translateY(12px);
    pointer-events: none;
    transition: .2s;
    z-index: 200
  }

  .toast.show {
    opacity: 1;
    transform: none
  }

  .modal {
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, .4);
    display: grid;
    place-items: center;
    z-index: 150;
    padding: 20px
  }

  .hidden {
    display: none !important
  }

  .modal-card {
    background: #fff;
    width: min(760px, 100%);
    border-radius: 16px;
    box-shadow: 0 25px 70px rgba(0, 0, 0, .25);
    overflow: hidden
  }

  .modal-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 18px;
    border-bottom: 1px solid var(--line)
  }

  .icon-btn {
    border: 0;
    background: transparent;
    font-size: 28px;
    color: var(--muted);
    cursor: pointer
  }

  .sku-preview {
    margin-top: 18px;
    border: 1px dashed #a8cbc6;
    background: #f7fbfa;
    padding: 14px 16px;
    border-radius: 12px;
    display: flex;
    justify-content: space-between;
    gap: 20px;
    align-items: center
  }

  .sku-preview strong {
    display: block;
    font-size: 22px;
    color: var(--primary);
    margin-top: 2px;
    letter-spacing: .05em
  }

  .sku-help {
    font-size: 12px;
    color: var(--muted);
    max-width: 360px;
    text-align: right
  }

  .hint {
    margin-top: 14px;
    padding: 10px 12px;
    border-radius: 9px;
    background: #f7f8fa;
    color: var(--muted);
    font-size: 12px
  }

  .actions-cell {
    display: flex;
    gap: 6px
  }

  /* ── Multi-product movement styles ───────────────────────── */
  .section-divider {
    border: 0;
    border-top: 2px solid var(--line);
    margin: 22px 0 18px
  }

  .products-section-label {
    font-size: 11px;
    font-weight: 900;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--primary);
    margin: 0 0 12px;
    display: flex;
    align-items: center;
    gap: 8px
  }

  .products-section-label::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--line)
  }

  .products-table-wrap {
    border: 1px solid var(--line);
    border-radius: 10px;
    overflow: hidden;
    margin-bottom: 10px
  }

  .products-table {
    width: 100%;
    border-collapse: collapse;
    min-width: 0
  }

  .products-table th {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: .06em;
    color: var(--muted);
    background: #f7f9fb;
    padding: 9px 10px;
    border-bottom: 1px solid var(--line);
